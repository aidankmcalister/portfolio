<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<title>Aidan McAlister — Portfolio</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #0a0a0b;
  --bg-soft: #111114;
  --bg-hover: #16161b;
  --border: #24242a;
  --border-soft: #18181d;
  --fg: #ededed;
  --fg-mid: #b4b4b4;
  --fg-dim: #7e7e82;
  --fg-faint: #4a4a4e;
  --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
[data-theme="light"] {
  --bg: #f7f6f1;
  --bg-soft: #fcfbf6;
  --bg-hover: #efede7;
  --border: #d6d4cb;
  --border-soft: #e7e5dd;
  --fg: #16161a;
  --fg-mid: #4a4a48;
  --fg-dim: #777570;
  --fg-faint: #b3b1a8;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-mono);
  font-size: 13.5px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-feature-settings: "ss01", "cv01", "cv11";
  min-height: 100vh;
  transition: background 0.22s ease, color 0.22s ease;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer; }
::selection { background: var(--fg); color: var(--bg); }

/* layout */
.shell {
  max-width: 1080px;
  margin: 0 auto;
  padding: 0 32px;
}
.nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 22px 0;
  border-bottom: 1px solid var(--border-soft);
  position: sticky;
  top: 0;
  background: var(--bg);
  z-index: 10;
  transition: background 0.22s ease;
}
.nav-left {
  display: flex;
  align-items: center;
  gap: 28px;
  font-size: 13px;
}
.nav-brand {
  color: var(--fg);
  letter-spacing: -0.01em;
}
.nav-brand .dim { color: var(--fg-dim); }
.nav-tabs {
  display: flex;
  align-items: center;
  gap: 4px;
}
.nav-tab {
  padding: 6px 10px;
  color: var(--fg-dim);
  border-radius: 4px;
  transition: color 0.15s ease, background 0.15s ease;
  font-size: 13px;
}
.nav-tab:hover { color: var(--fg); background: var(--bg-hover); }
.nav-tab.active { color: var(--fg); }
.nav-tab.active::before { content: '>'; margin-right: 4px; color: var(--fg-dim); }
.nav-right {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 12.5px;
  color: var(--fg-dim);
}
.theme-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--fg-dim);
  transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease;
}
.theme-btn:hover { color: var(--fg); border-color: var(--fg-dim); }

/* ── HOME ── */
.home-wrap {
  display: grid;
  grid-template-columns: minmax(0, 180px) minmax(0, 1fr);
  gap: 56px;
  align-items: start;
  padding: 96px 0 64px;
}
@media (max-width: 720px) {
  .home-wrap { grid-template-columns: 1fr; gap: 32px; padding-top: 56px; }
}
.ascii {
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 1.15;
  color: var(--fg-dim);
  white-space: pre;
  user-select: none;
}
.ascii.muted { color: var(--fg-faint); }

.home-hero h1 {
  font-family: var(--font-mono);
  font-weight: 500;
  font-size: 28px;
  line-height: 1.25;
  letter-spacing: -0.015em;
  margin: 0 0 18px;
  max-width: 620px;
  color: var(--fg);
}
.home-hero h1 .accent { color: var(--fg-dim); }
.home-hero .sub {
  font-size: 14px;
  color: var(--fg-dim);
  margin: 0 0 28px;
  max-width: 540px;
  line-height: 1.6;
}
.home-hero .bio {
  font-size: 13px;
  color: var(--fg-mid);
  max-width: 560px;
  margin: 0 0 36px;
  line-height: 1.7;
}
.home-hero .bio em {
  font-style: normal;
  color: var(--fg);
  border-bottom: 1px dotted var(--fg-faint);
  padding-bottom: 1px;
}
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  font-size: 12.5px;
  color: var(--fg);
  border: 1px solid var(--border);
  border-radius: 5px;
  background: transparent;
  transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
}
.btn:hover { border-color: var(--fg-dim); background: var(--bg-soft); }
.btn .arrow { color: var(--fg-dim); transition: transform 0.15s ease, color 0.15s ease; }
.btn:hover .arrow { color: var(--fg); transform: translate(1px, -1px); }
.btn-row .glyph { color: var(--fg-dim); }

/* meta row under hero */
.home-meta {
  margin-top: 64px;
  padding-top: 22px;
  border-top: 1px solid var(--border-soft);
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 32px;
  font-size: 12px;
}
@media (max-width: 720px) {
  .home-meta { grid-template-columns: 1fr; gap: 20px; }
}
.home-meta .k { color: var(--fg-dim); margin-bottom: 4px; }
.home-meta .v { color: var(--fg); }
.home-meta .v .dim { color: var(--fg-dim); }

/* ── WORK ── */
.work-head {
  padding: 64px 0 28px;
  display: grid;
  grid-template-columns: minmax(0, 180px) minmax(0, 1fr);
  gap: 56px;
  align-items: start;
}
@media (max-width: 720px) {
  .work-head { grid-template-columns: 1fr; gap: 24px; padding-top: 40px; }
}
.work-head h2 {
  margin: 0 0 12px;
  font-size: 22px;
  font-weight: 500;
  letter-spacing: -0.01em;
}
.work-head p {
  margin: 0;
  font-size: 13px;
  color: var(--fg-dim);
  max-width: 540px;
  line-height: 1.65;
}
.work-head .crumb { color: var(--fg-dim); margin-bottom: 8px; }

.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 0;
  border-top: 1px solid var(--border-soft);
  border-bottom: 1px solid var(--border-soft);
  margin-top: 20px;
  flex-wrap: wrap;
  gap: 16px;
}
.chips {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 9px;
  font-size: 11.5px;
  color: var(--fg-dim);
  border: 1px solid transparent;
  border-radius: 4px;
  transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease;
  text-transform: lowercase;
}
.chip:hover { color: var(--fg); background: var(--bg-hover); }
.chip.active {
  color: var(--fg);
  border-color: var(--border);
  background: var(--bg-soft);
}
.chip .count {
  color: var(--fg-faint);
  font-size: 10.5px;
}
.chip.active .count { color: var(--fg-dim); }

.viewswitch {
  display: inline-flex;
  align-items: center;
  border: 1px solid var(--border);
  border-radius: 5px;
  overflow: hidden;
}
.viewswitch button {
  padding: 5px 9px;
  font-size: 11.5px;
  color: var(--fg-dim);
  border-right: 1px solid var(--border);
  transition: color 0.15s ease, background 0.15s ease;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.viewswitch button:last-child { border-right: none; }
.viewswitch button:hover { color: var(--fg); background: var(--bg-hover); }
.viewswitch button.active { color: var(--fg); background: var(--bg-soft); }

.filter-meta {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 12px 0 8px;
  font-size: 11.5px;
  color: var(--fg-dim);
}
.filter-meta .sep { color: var(--fg-faint); }

/* LIST VIEW */
.list {
  border-top: 1px solid var(--border-soft);
}
.list-row {
  display: grid;
  grid-template-columns: 64px minmax(0, 2.4fr) minmax(0, 1fr) 28px;
  gap: 24px;
  padding: 16px 8px 16px 0;
  border-bottom: 1px solid var(--border-soft);
  align-items: baseline;
  transition: background 0.15s ease, padding 0.15s ease;
  position: relative;
}
.list-row::before {
  content: '';
  position: absolute;
  left: -16px; right: -16px;
  top: 0; bottom: 0;
  background: transparent;
  border-radius: 6px;
  pointer-events: none;
  transition: background 0.15s ease;
  z-index: -1;
}
.list-row:hover::before { background: var(--bg-soft); }
.list-row:hover .list-arrow { color: var(--fg); transform: translate(2px, -2px); }
.list-type {
  font-size: 11px;
  color: var(--fg-dim);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.list-title {
  color: var(--fg);
  font-size: 14px;
}
.list-title .desc {
  display: block;
  color: var(--fg-dim);
  font-size: 12.5px;
  margin-top: 4px;
  font-weight: 400;
}
.list-ctx { color: var(--fg-dim); font-size: 12px; }
.list-ctx .at { color: var(--fg-faint); }
.list-arrow {
  color: var(--fg-faint);
  transition: color 0.15s ease, transform 0.15s ease;
  justify-self: end;
  font-size: 12px;
}
@media (max-width: 720px) {
  .list-row {
    grid-template-columns: 1fr 28px;
    gap: 8px;
  }
  .list-type { grid-column: 1 / -1; }
  .list-ctx { grid-column: 1; }
}

/* GRID VIEW */
.grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 0;
  border-top: 1px solid var(--border-soft);
  border-left: 1px solid var(--border-soft);
}
@media (max-width: 720px) {
  .grid { grid-template-columns: 1fr; }
}
.card {
  position: relative;
  padding: 22px 22px 22px;
  border-right: 1px solid var(--border-soft);
  border-bottom: 1px solid var(--border-soft);
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-height: 168px;
  transition: background 0.15s ease;
}
.card:hover { background: var(--bg-soft); }
.card:hover .card-arrow { color: var(--fg); transform: translate(2px, -2px); }
.card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11px;
  color: var(--fg-dim);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.card-arrow {
  color: var(--fg-faint);
  transition: color 0.15s ease, transform 0.15s ease;
  text-transform: none;
}
.card-title {
  font-size: 14.5px;
  color: var(--fg);
  margin-top: 4px;
  line-height: 1.35;
}
.card-desc {
  font-size: 12.5px;
  color: var(--fg-dim);
  line-height: 1.55;
  flex: 1;
}
.card-foot {
  font-size: 11.5px;
  color: var(--fg-dim);
  display: flex;
  align-items: center;
  gap: 8px;
}
.card-foot .at { color: var(--fg-faint); }

/* READER VIEW */
.reader {
  max-width: 680px;
  margin: 0 auto;
  padding: 16px 0 0;
}
.reader-item {
  padding: 28px 0;
  border-bottom: 1px solid var(--border-soft);
  display: grid;
  grid-template-columns: 56px 1fr 24px;
  gap: 28px;
  align-items: start;
  transition: padding 0.15s ease;
}
.reader-item:hover .reader-arrow { color: var(--fg); transform: translate(2px, -2px); }
.reader-num {
  font-size: 11px;
  color: var(--fg-faint);
  padding-top: 4px;
}
.reader-body {}
.reader-meta {
  font-size: 11px;
  color: var(--fg-dim);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 8px;
}
.reader-meta .sep { color: var(--fg-faint); margin: 0 8px; }
.reader-title {
  font-size: 18px;
  color: var(--fg);
  margin: 0 0 10px;
  font-weight: 500;
  letter-spacing: -0.01em;
  line-height: 1.3;
}
.reader-desc {
  font-size: 13.5px;
  color: var(--fg-mid);
  line-height: 1.65;
  margin: 0;
  max-width: 560px;
}
.reader-arrow {
  color: var(--fg-faint);
  transition: color 0.15s ease, transform 0.15s ease;
  padding-top: 6px;
  font-size: 13px;
}
@media (max-width: 720px) {
  .reader-item {
    grid-template-columns: 1fr 24px;
    gap: 8px;
  }
  .reader-num { grid-column: 1 / -1; }
}

/* footer */
.footer {
  border-top: 1px solid var(--border-soft);
  margin-top: 80px;
  padding: 28px 0 36px;
  display: flex;
  justify-content: space-between;
  font-size: 11.5px;
  color: var(--fg-faint);
}
.footer .right { display: flex; gap: 16px; }

/* empty state */
.empty {
  padding: 80px 0;
  text-align: center;
  color: var(--fg-dim);
  font-size: 13px;
}
.empty pre { color: var(--fg-faint); margin: 0 0 16px; }

/* page fade */
.page-fade {
  animation: fade 0.22s ease;
}
@keyframes fade {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: none; }
}
</style>
</head>
<body>
<div id="root"></div>

</body>
